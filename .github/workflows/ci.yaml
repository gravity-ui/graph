name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  verify_files:
    name: Verify Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      # Builds the packages once; later steps read the built declarations of workspace dependencies.
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint Files
        run: pnpm run lint
      - name: Strict diagnostic gate tests
        run: pnpm run test:strict-diagnostics
      - name: Strict diagnostic debt gate
        run: node scripts/strict-diagnostics.mjs
      - name: Type configuration tests
        run: pnpm run test:type-configs

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Unit Tests
        run: pnpm run test
      # - name: ESBuild compatability
      #   run: pnpm run test:esbuild
