name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  verify_files:
    name: Verify Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Lint Files
        run: pnpm run lint
      - name: Strict diagnostic gate tests
        run: pnpm run test:strict-diagnostics
      - name: Strict diagnostic debt gate
        run: pnpm run typecheck:strict
      - name: Type configuration tests
        run: pnpm run test:type-configs
      - name: Typecheck
        run: pnpm run typecheck

  typescript_7:
    name: TypeScript 7 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      # Builds the packages, then runs the native TypeScript 7 CLI from tools/typescript-native
      # over every source config (--noEmit), every publish config (declaration emit to a temp
      # directory) and every tests/types consumer fixture. The first line names the compiler.
      - name: Typecheck with TypeScript 7
        run: pnpm run typecheck:ts7

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Unit Tests
        run: pnpm run test
      # - name: ESBuild compatability
      #   run: pnpm run test:esbuild
