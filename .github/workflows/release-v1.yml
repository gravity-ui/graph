name: Release v1

on:
  push:
    branches:
      - main
      - release/v1

permissions:
  contents: read

jobs:
  release-main:
    name: Release v1 from main
    # Creating a branch is not a release event. Skip the whole job before any
    # App token is minted; ordinary pushes must pass the version/route guard.
    if: >-
      github.ref_name == 'main' &&
      github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for release preflight
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node for release preflight
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release route
        run: >-
          node .github/release-routing/validate.mjs guard-push
          --route pre-cutover-v1
          --branch "${{ github.ref_name }}"
          --dist-tag latest
          --prerelease false
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
      # The App creates/updates the reviewed release PR and publishes only after
      # that PR is merged. Its ruleset bypass must be limited to those operations.
      - name: Generate release App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GRAVITY_UI_APP_ID }}
          private-key: ${{ secrets.GRAVITY_UI_APP_PRIVATE_KEY }}
      - name: Release v1 from main
        uses: gravity-ui/release-action@v1
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          npm-token: ${{ secrets.GRAVITY_UI_BOT_NPM_TOKEN }}
          node-version: 24
          default-branch: main
          npm-dist-tag: latest

  release-maintenance:
    name: Release v1 from release/v1
    # This future route remains inactive until the explicit cutover config
    # change. Branch creation also skips the whole job before token generation.
    if: >-
      github.ref_name == 'release/v1' &&
      github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for release preflight
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node for release preflight
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release route
        run: >-
          node .github/release-routing/validate.mjs guard-push
          --route post-cutover-v1
          --branch "${{ github.ref_name }}"
          --dist-tag v1
          --prerelease false
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
      # Keep any App bypass scoped to release PR and publication operations.
      - name: Generate release App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GRAVITY_UI_APP_ID }}
          private-key: ${{ secrets.GRAVITY_UI_APP_PRIVATE_KEY }}
      - name: Release v1 from release/v1
        uses: gravity-ui/release-action@v1
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          npm-token: ${{ secrets.GRAVITY_UI_BOT_NPM_TOKEN }}
          node-version: 24
          default-branch: release/v1
          npm-dist-tag: v1
