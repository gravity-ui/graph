name: PR Title

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  verify_title:
    name: Verify Title
    runs-on: ubuntu-latest
    if: ${{github.event.action != 'edited' || github.event.changes.title}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Run Commitlint
        run: echo "${{github.event.pull_request.title}}" | pnpm exec commitlint
