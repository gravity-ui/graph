name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  e2e_tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @gravity-ui/graph-e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e:ci
        env:
          CI: true

      - name: Test installed package consumers
        run: pnpm run test:package-contract
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            packages/graph/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/e2e/test-results/
            packages/graph/test-results/
          retention-days: 7
